info:
  name: cart get
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/v1/cart/{{ecommerceId}}/{{customerId}}"
  auth: inherit

runtime:
  variables:
    - name: ecommerceId
      value: e1
    - name: customerId
      value: c1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
